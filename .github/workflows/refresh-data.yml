name: refresh-data

on:
  schedule:
    - cron: "17 6 * * *"   # every day, early morning UTC
  workflow_dispatch:        # lets me run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests pandas

      - name: Pull latest results and fixtures
        working-directory: backend
        run: python -m ingest.refresh

      # runs even if one download failed, so a partial refresh still gets saved
      - name: Commit if anything changed
        if: always()
        run: |
          git config user.name "data-refresh-bot"
          git config user.email "data-refresh-bot@users.noreply.github.com"
          git add backend/data
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "Refresh match data and fixtures"
            git push
          fi